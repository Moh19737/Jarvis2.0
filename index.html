<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Jarvis</title>
<style>
:root{--a:110,200,255;--b:255,180,84;--bg:#050912;--pan:rgba(10,20,36,.72);--line:rgba(var(--a),.3);--ice:rgb(var(--a));--tx:#e6f1fb;--dim:#8fa8c2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:300 16px/1.5 "Avenir Next","Helvetica Neue",system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
a{color:var(--ice)}
button,input{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:4px;padding:6px 12px}
button{cursor:pointer}
button:hover,button:focus-visible,input:focus-visible{border-color:var(--ice);outline:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18px}
#orb{--o:170px;width:var(--o);height:var(--o);flex:none;margin:70px 0 82px;border-radius:50%;cursor:pointer;transition:width .5s,height .5s}
body:not(.active) #orb{--o:210px}
#cap{min-width:0;width:min(640px,46vw)}
#status{color:var(--dim);font-size:14px}
#said{font-size:16px;line-height:1.4}
#heard{color:var(--dim);font-size:14px;min-height:21px}
#grid{flex:1;min-height:0;display:grid;gap:10px;padding:0 18px 10px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));grid-auto-rows:minmax(260px,1fr);overflow:auto}
body:not(.active) #grid{display:none}
.tile{background:var(--pan);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.tile.spot{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 20px rgba(var(--a),.3)}
.tile.big{grid-column:1/-1;grid-row:span 2}
.th{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
.th button{padding:1px 8px;font-size:12px;margin-left:6px}
.tb{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.tb.f{padding:0;overflow:hidden}
.tb p{margin:0 0 .7em}
.tb>button{margin:0 6px 6px 0}
.tb small{color:var(--dim)}
iframe{width:100%;height:100%;border:0;background:#fff}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ig img{width:100%;height:110px;object-fit:cover;border-radius:3px;display:block}
.ig .v{text-align:left;padding:0;border:0;display:block}
.ig .v img{height:90px}
.ig .v b{display:block;font-weight:400;font-size:13px;line-height:1.3;margin-top:4px}
footer{display:flex;background:rgba(5,9,18,.55);gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);flex:none}
footer input{flex:1;min-width:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#stage,footer{position:relative;z-index:1}
#hud{position:fixed;top:12px;right:18px;z-index:2;text-align:right;color:var(--dim);font-size:13px;line-height:1.4}
#hud b{font-size:22px;font-weight:300;color:var(--tx)}
dialog{background:#0f1b2f;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 4px;font-weight:300}
dialog label{display:block;margin:12px 0 4px;color:var(--dim);font-size:13px}
dialog input{width:100%}
#sw{display:flex;gap:10px}
#sw button{width:34px;height:34px;border-radius:50%;padding:0}
.row{flex-wrap:wrap;display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#dmsg{color:var(--dim);font-size:13px;min-height:19px}
html{color-scheme:dark}
#grid{position:fixed;inset:0;z-index:1;pointer-events:none;display:block;overflow:hidden;padding:0}
.tile{position:absolute;pointer-events:auto;border-radius:22px;min-width:240px;min-height:150px;resize:both;border-color:rgba(var(--a),.28);box-shadow:0 0 34px rgba(var(--a),.1),inset 0 0 40px rgba(var(--a),.05)}
.tile.enter{animation:pop .55s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.tile::before,.tile::after{content:"";position:absolute;width:18px;height:18px;pointer-events:none;border:2px solid var(--ice);z-index:2}
.tile::before{top:9px;left:9px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.tile::after{right:9px;bottom:9px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.tile.drag{backdrop-filter:none;background:rgba(10,20,36,.92);box-shadow:0 0 50px rgba(var(--a),.28)}
.th{cursor:grab;touch-action:none;user-select:none;padding:9px 20px 7px}
.tile.drag .th{cursor:grabbing}
.nm::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 8px var(--ice);animation:pulse 2s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}}
@keyframes fl{to{transform:translateY(-5px)}}
@keyframes pulse{50%{opacity:.3}}
.tb{padding:10px 18px 18px}
.tb.f{padding:0}
.ig{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.ig img{height:78px}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(640px,46vw);margin-top:14px;padding:6px;border-radius:20px;transition:box-shadow .3s}
#chips.spot{box-shadow:0 0 22px rgba(var(--a),.35)}
#chips button{border-radius:999px;background:rgba(10,20,36,.6)}
@media(prefers-reduced-motion:reduce){.tile,.nm::before{animation:none!important}}
dialog input[type=checkbox]{width:auto;margin-right:8px}
dialog{max-height:90vh;overflow:auto}
.tb{position:relative}
.tb video{width:100%;height:100%;object-fit:cover;display:block}
.tile.scan .tb::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ice);box-shadow:0 0 14px var(--ice);animation:scan 1.3s linear infinite}
@keyframes scan{to{top:100%}}
dialog select{width:100%;font:inherit;color:var(--tx);background:#0f1b2f;border:1px solid var(--line);border-radius:4px;padding:6px 12px}

/* ---------- v2: page scrolls, more life ---------- */
html,body{height:auto}
html{min-height:100%}
body{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:visible;min-height:100vh;min-height:100dvh;padding-bottom:70px}
footer{position:fixed;left:0;right:0;bottom:0;z-index:3;backdrop-filter:blur(8px)}
#grid{position:absolute;inset:0 auto auto 0;width:100%;height:0;overflow:visible;z-index:1;pointer-events:none}
#orb{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
#said{min-height:1.4em}
#status{transition:color .4s}
body[data-st=speak] #status{color:rgb(var(--b))}
body[data-st=think] #status{color:var(--tx);animation:pulse 1.2s ease-in-out infinite}
body[data-st=listen] #status{color:rgb(var(--a))}
#chips button{animation:fadeUp .5s ease backwards;transition:transform .2s,box-shadow .2s,border-color .2s}
#chips button:nth-child(2){animation-delay:.08s}#chips button:nth-child(3){animation-delay:.16s}#chips button:nth-child(4){animation-delay:.24s}#chips button:nth-child(5){animation-delay:.32s}
#chips button:hover{transform:translateY(-2px);box-shadow:0 0 14px rgba(var(--a),.35)}
.tb p{animation:fadeUp .5s ease backwards}
.tb p:nth-child(2){animation-delay:.06s}.tb p:nth-child(3){animation-delay:.12s}.tb p:nth-child(4){animation-delay:.18s}.tb p:nth-child(5){animation-delay:.24s}.tb p:nth-child(n+6){animation-delay:.3s}
.ig>*{animation:fadeUp .45s ease backwards}
.ig>*:nth-child(2){animation-delay:.04s}.ig>*:nth-child(3){animation-delay:.08s}.ig>*:nth-child(4){animation-delay:.12s}.ig>*:nth-child(5){animation-delay:.16s}.ig>*:nth-child(6){animation-delay:.2s}.ig>*:nth-child(n+7){animation-delay:.24s}
.tile:hover{border-color:rgba(var(--a),.55)}
@media(prefers-reduced-motion:reduce){#orb,#chips button,.tb p,.ig>*,body[data-st=think] #status{animation:none!important}}
@media(max-width:760px){
 body.active #stage{flex:none;justify-content:flex-start;padding-top:56px}
 body.active #orb{--o:120px;margin:26px 0 38px}
 body:not(.active) #orb{--o:170px;margin:60px 0 60px}
 #cap,#chips{width:100%;max-width:100%}
 #hud{font-size:11px;top:8px;right:12px}#hud b{font-size:16px}
 #grid{position:relative;inset:auto;height:auto;display:flex;flex-direction:column;gap:12px;padding:0 12px 16px;pointer-events:auto}
 body:not(.active) #grid{display:none}
 .tile{position:relative;left:auto!important;top:auto!important;width:100%!important;height:320px!important;resize:none;flex:none}
 .tile.tall{height:75vh!important}
 .th{touch-action:auto;cursor:default}
 footer{padding:8px 12px 12px;flex-wrap:wrap}
 footer input{flex:1 1 100%}
 body{padding-bottom:110px}
}
</style></head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div id="hud"></div>
<main id="stage"><div id="orb" role="button" tabindex="0" aria-label="Start or stop Jarvis"></div>
<div id="cap"><div id="status">Tap the orb to wake Jarvis</div><div id="said"></div><div id="heard">Say: “Hey Jarvis, how did the dinosaurs die”, “Hey Jarvis, search YouTube for lo-fi”, “Hey Jarvis, close”.</div></div><div id="chips"></div></main>
<section id="grid" aria-live="polite"></section>
<footer><input id="txt" placeholder="Type a question and press Enter" autocomplete="off" aria-label="Ask Jarvis"><button id="mic">Mic off</button><button id="stop">Stop talking</button><button id="gear">Settings</button></footer>
<dialog id="dlg"><h2>Settings</h2>
<label>Color theme</label><div id="sw"></div>
<label>ElevenLabs API key</label><input id="elk" type="password" autocomplete="off" placeholder="Paste your key">
<label>ElevenLabs voice ID</label><input id="elv" autocomplete="off" placeholder="Leave empty for a default male voice">
<label>YouTube Data API key</label><input id="ytk" type="password" autocomplete="off" placeholder="Optional, for YouTube search">
<label>Answer questions with</label><select id="brn"><option value="wiki">Wikipedia (fast, default)</option><option value="ai">AI (smarter but slower, needs a key below)</option></select>
<label>Free Gemini API key from aistudio.google.com (Google search, camera vision)</label><input id="gek" type="password" autocomplete="off" placeholder="Stored only in this browser">
<label>Gemini model</label><input id="gmd" autocomplete="off" placeholder="Leave empty to use gemini-flash-lite-latest (fast)">
<label>Claude API key (paid, optional)</label><input id="ank" type="password" autocomplete="off" placeholder="Stored only in this browser">
<label>Claude model</label><input id="mdl" autocomplete="off" placeholder="claude-haiku-5-5 is fast. claude-sonnet-5-5 goes deeper.">
<label><input type="checkbox" id="wb"> Search the live web when answering (slower)</label>
<label><input type="checkbox" id="nw"> Require “Hey Jarvis” before commands</label>
<p id="dmsg"></p>
<div class="row"><button id="dmic">Test mic</button><button id="dreset">Reset layout</button><button id="dtest">Test voice</button><button id="dsave">Save</button><button id="dclose">Close</button></div></dialog>
<script>
const $=s=>document.querySelector(s),grid=$('#grid'),orb=$('#orb'),enc=encodeURIComponent;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let tyId=0,rec,recRun=false,greetPending=false,want=false,speaking=false,gen=0,tiles=[],vids=[],yt=null,greeted=false;
const j=u=>fetch(u).then(r=>{if(!r.ok)throw r.status;return r.json()});
const setState=(c,t)=>{orb.className=c;document.body.dataset.st=c;$('#status').textContent=t};
const note=t=>{$('#heard').textContent=t};
const idle=()=>setState('listen',want?(ls.get('nowake')||Date.now()<awakeUntil?'Listening':'Say “Hey Jarvis”'):'Ready');

/* ---------- screen ---------- */
let zTop=10;
const panelH=()=>Math.max(120,Math.min(290,(innerHeight-84-76-40)/3));
function place(el,slot){
  const w0=innerWidth,h0=innerHeight,m=22,top=76,bot=h0-84;
  let w=Math.max(290,Math.min(380,w0*.25)),h=panelH(),L=m,T=top;
  if(slot==='tc'){w=Math.min(340,w0*.24);h=170;L=(w0-w)/2;T=14}
  else if(slot==='yt'){w=Math.min(600,w0*.4);h=Math.min(440,(bot-100)*.7);L=w0-w-m;T=100}
  else{if(slot[1]==='r')L=w0-w-m;T=slot[0]==='t'?(slot[1]==='r'?92:top):slot[0]==='m'?(top+bot-h)/2:bot-h}
  Object.assign(el.style,{left:L+'px',top:T+'px',width:w+'px',height:h+'px'});
  const sv=(ls.get('pos:'+slot)||'').split(',').map(parseFloat);
  if(sv.length===4&&sv.every(isFinite))Object.assign(el.style,{left:Math.max(80-sv[2],Math.min(innerWidth-80,sv[0]))+'px',top:Math.max(0,Math.min(innerHeight-50,sv[1]))+'px',width:sv[2]+'px',height:sv[3]+'px'});
  el._slot=slot;el._base=[el.style.left,el.style.top,el.style.width,el.style.height].join();
}
function savePos(el){if(el._s)return;const c=[el.style.left,el.style.top,el.style.width,el.style.height].join();if(c!==el._base){el._base=c;ls.set('pos:'+el._slot,c)}}
function resetLayout(){['tl','ml','bl','tr','mr','br','tc','yt'].forEach(k=>{try{localStorage.removeItem('pos:'+k)}catch(e){}});tiles.forEach(t=>{if(t._slot){t._s=null;const x=t.querySelector('.x');if(x)x.textContent='Expand';place(t,t._slot)}})}
function drag(el,h){
  h.addEventListener('pointerdown',e=>{
    if(e.target.closest('a,button')||e.button>0||matchMedia('(max-width:760px)').matches)return;
    const r=el.getBoundingClientRect(),ox0=r.left+scrollX,oy0=r.top+scrollY,dx=e.pageX-ox0,dy=e.pageY-oy0;let nx=ox0,ny=oy0,raf=0;
    el.style.zIndex=++zTop;el.classList.add('drag');h.setPointerCapture(e.pointerId);
    const mv=ev=>{if(ev.clientY>innerHeight-80)scrollBy(0,18);else if(ev.clientY<80&&scrollY>0)scrollBy(0,-18);nx=Math.max(80-r.width,Math.min(innerWidth-80,ev.pageX-dx));ny=Math.max(0,Math.min(Math.max(innerHeight,document.documentElement.scrollHeight)+200,ev.pageY-dy));if(!raf)raf=requestAnimationFrame(()=>{raf=0;el.style.left=nx+'px';el.style.top=ny+'px'})};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);cancelAnimationFrame(raf);el.style.left=nx+'px';el.style.top=ny+'px';el.classList.remove('drag');savePos(el)};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}
function tile(name,link,framed,slot){
  const el=document.createElement('article');el.className='tile';
  el.innerHTML='<div class="th"><span class="nm">'+esc(name)+'</span><span><a class="ol" target="_blank" rel="noopener"'+(link?' href="'+esc(link)+'"':' hidden')+'>Open in new tab</a><button class="x">Expand</button></span></div><div class="tb'+(framed?' f':'')+'">Loading…</div>';
  place(el,slot||'tl');el.style.setProperty('--d',(tiles.length*.12)+'s');el.classList.add('enter');el.addEventListener('animationend',()=>el.classList.remove('enter'),{once:true});
  el.addEventListener('pointerdown',()=>{el.style.zIndex=++zTop});
  el.querySelector('.x').onclick=e=>{
    if(matchMedia('(max-width:760px)').matches){const on=el.classList.toggle('tall');el._s=on?{}:null;e.target.textContent=on?'Shrink':'Expand';if(on)el.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(el._s){Object.assign(el.style,el._s);el._s=null;e.target.textContent='Expand'}
    else{el._s={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};Object.assign(el.style,{left:'5vw',top:(scrollY+72)+'px',width:'90vw',height:'calc(100vh - 160px)',zIndex:++zTop});e.target.textContent='Shrink'}
  };
  drag(el,el.querySelector('.th'));
  grid.append(el);tiles.push(el);
  return{el,body:el.querySelector('.tb'),link:u=>{const k=el.querySelector('.ol');k.href=u;k.hidden=false}};
}
function spot(el){tiles.forEach(t=>t.classList.toggle('spot',t===el))}
function clearScreen(keep){
  if(!keep){halt();document.body.classList.remove('active');$('#said').textContent='';idle()}
  const c=keep&&cam?cam.el:null;
  grid.innerHTML='';$('#chips').innerHTML='';tiles=[];yt=null;
  if(c){grid.append(c);tiles.push(c)}else stopCam();
  if(!keep)suggest();
}
const show=()=>{document.body.classList.add('active');scrollTo({top:0,behavior:'smooth'})};

/* ---------- voice out ---------- */
function typeSaid(t){const el=$('#said'),my=++tyId;if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=t;return}el.textContent='';const d=Math.min(2200,t.length*30),t0=performance.now();const f=n=>{if(my!==tyId)return;const k=Math.min(1,(n-t0)/d);el.textContent=t.slice(0,Math.ceil(k*t.length));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function voice(){const v=speechSynthesis.getVoices();const mv=v.find(x=>/en-gb-x-(gbd|rjs)|en-us-x-(iom|iol|tpd)/i.test((x.voiceURI||'')+(x.name||'')));if(mv)return mv;for(const n of['Daniel','Oliver','Samantha','Karen'])for(const x of v)if(x.name.startsWith(n))return x;return v.find(x=>/^en/.test(x.lang))}
function halt(){gen++;tyId++;if(ctl){ctl.abort();ctl=null}speechSynthesis.cancel();if(cur){cur.pause();cur=null}speaking=false;spot()}
function stopSpeak(){halt();idle();resumeRec()}
let cur=null,elBad=false,ac,an,fd;
const useEL=()=>!elBad&&ls.get('elkey');
const cache=new Map();
function elFetch(text){
  if(!cache.has(text)){
    const k=ls.get('elkey'),v=ls.get('elvoice')||'JBFqnCBsd6RMkjVDRZzb';
    cache.set(text,fetch('https://api.elevenlabs.io/v1/text-to-speech/'+enc(v)+'?output_format=mp3_44100_128',{method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json'},body:JSON.stringify({text,model_id:'eleven_flash_v2_5'})}).then(r=>{if(!r.ok)throw new Error('ElevenLabs answered '+r.status+(r.status===401?' (check the API key)':r.status===404||r.status===400?' (check the voice ID)':''));return r.blob()}));
    if(cache.size>40)cache.delete(cache.keys().next().value);
  }
  return cache.get(text);
}
function hook(a){try{ac=ac||new AudioContext();an=an||ac.createAnalyser();an.fftSize=256;fd=fd||new Uint8Array(an.frequencyBinCount);ac.resume();const s=ac.createMediaElementSource(a);s.connect(an);an.connect(ac.destination)}catch(e){}}
function elFail(e){elBad=true;const m=String(e&&e.message||e);note('ElevenLabs problem: '+m+'. Using the Mac voice instead.');$('#dmsg').textContent=m}

const NMAP=[[/^Jarvis online\.$/,'Jarvis doth awaken, my lord. At thy service.'],[/^Yes\?$/,'Thou summonest me, my lord?'],[/^Shutting down\. Goodbye\.$/,'I take my leave, my lord. Fare thee well.'],[/^Camera on\..*/,'The seeing glass is open, my lord. Show me a thing and ask what it be.'],[/^Camera off\.$/,'The seeing glass is closed, my lord.'],[/^Layout reset\.$/,'The chambers are set in order, my lord.'],[/^Color changed\.$/,'The banners are re-coloured, my lord.'],[/^It is (\d.*)\.$/,'The hour is $1, my lord.'],[/^Today is (.*)\.$/,'Today be $1, my lord.'],[/^Opening /,'Forthwith, my lord, I open ']];
const ADDR=['Aye, my lord. ','Hark, good sir. ','At once, milord. ','As thou wishest, sir. ','Prithee, hear me, my lord. '];
function noble(t,i){
  for(const[r,v]of NMAP)if(r.test(t))return t.replace(r,v);
  if(i===0&&t.length>40&&!/\b(sir|my lord|milord)\b/i.test(t))return ADDR[Math.random()*ADDR.length|0]+t;
  return t;
}
function say(parts,done){parts.forEach((p,i)=>{if(!p.n){p.n=1;p.t=noble(p.t,i)}});
  halt();speaking=true;pauseRec();const my=gen,was=Date.now()<awakeUntil;let i=0;
  const show1=p=>{if(my!==gen)return;setState('speak','Speaking');typeSaid(p.t);spot(p.tile)};
  const browser=(p,next)=>{const u=new SpeechSynthesisUtterance(p.t),v=voice();if(v)u.voice=v;u.rate=1.05;u.pitch=.85;u.onstart=()=>show1(p);u.onend=u.onerror=next;speechSynthesis.speak(u)};
  const step=()=>{
    if(my!==gen)return;
    if(i>=parts.length){if(parts.open){setTimeout(step,120);return}if(was)awakeUntil=Date.now()+20000;speaking=false;spot();idle();resumeRec();if(done)done();return}
    const p=parts[i++],nx=parts[i];
    if(!useEL())return browser(p,step);
    elFetch(p.t).then(b=>{
      if(my!==gen)return;
      const a=new Audio(URL.createObjectURL(b));cur=a;hook(a);show1(p);
      a.onended=()=>{cur=null;step()};a.onerror=()=>{cur=null;step()};
      a.play().catch(()=>{cur=null;step()});
      if(nx)elFetch(nx.t).catch(()=>{});
    }).catch(e=>{elFail(e);if(my===gen)browser(p,step)});
  };
  setTimeout(step,30);
}

/* ---------- voice in ---------- */

  if(!rec){

    rec.onresult=e=>{let f='',m='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript;else m+=r[0].transcript}
      hearT=Date.now();if(m)note('Hearing: '+m);if(f.trim())handle(f.trim())};

    };
    rec.onstart=()=>{recRun=true;if(greetPending&&!greeted){greeted=true;greetPending=false;say([{t:'Jarvis online.'}])}};
    rec.onspeechstart=()=>{hearT=Date.now();note('Hearing you…')};

  }

  try{st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){note('Camera error: '+e.name+(e.name==='NotAllowedError'?'. Allow the camera for this page in Chrome, and for Chrome in System Settings, Privacy & Security, Camera.':''));say([{t:'I cannot open the camera.'}]);return null}
  show();const t=tile('Camera','',1,'tc');t.body.innerHTML='<video autoplay muted playsinline></video>';
  const v=t.body.firstChild;v.srcObject=st;cam={el:t.el,v,st};return cam;
}
function stopCam(){if(cam){cam.st.getTracks().forEach(x=>x.stop());cam.el.remove();tiles=tiles.filter(x=>x!==cam.el);cam=null}}
function grab(){const v=cam.v,c=document.createElement('canvas'),k=Math.min(1,1024/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('Could not load '+u));document.head.append(e)});
async function localModel(){
  if(!lm){await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');lm=await window.mobilenet.load()}
  return lm;
}
async function look(q){
  halt();const c=await startCam();if(!c)return;
  for(let i=0;i<30&&!c.v.videoWidth;i++)await new Promise(r=>setTimeout(r,100));
  if(!c.v.videoWidth){say([{t:'The camera is not giving me a picture yet. Try again in a moment.'}]);return}
  setState('think','Looking…');c.el.classList.add('scan');
  const cnv=grab();
  try{(ls.get('anthkey')||ls.get('gemkey'))?await lookClaude(cnv,q,c):await lookLocal(cnv)}
  catch(e){if(e.name!=='AbortError'){note('Vision problem: '+e.message);say([{t:'I could not analyse the picture. '+e.message}])}}
  c.el.classList.remove('scan');
}
async function lookLocal(cnv){
  note('Loading the on-device recognizer. The first time takes a few seconds.');
  const pr=await (await localModel()).classify(cnv,3),n=pr.map(p=>p.className.split(',')[0].trim());
  const intro=pr[0].probability<.2?'I am not sure what that is. My closest guess is '+n[0]+', then '+n[1]+'. Add a free Gemini key in Settings for much better identification.':'I think this is '+(/^[aeiou]/i.test(n[0])?'an ':'a ')+n[0]+', about '+Math.round(pr[0].probability*100)+' percent sure. It could also be '+n[1]+' or '+n[2]+'.';
  research(n[0],{intro});
}
async function lookClaude(cnv,q,c){
  const data=cnv.toDataURL('image/jpeg',.8).split(',')[1],parts=[];parts.open=true;
  let R=null,first='',head=true,txt='',p=null;
  const sn=sentencer(parts,()=>R?R.ov.el:c.el),user=q||'What am I showing you? Identify it and explain it in depth.';
  say(parts);
  try{
    await claude({system:VIS,web:false,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data}},{type:'text',text:user}]}],
      onText:d=>{
        if(head){
          first+=d;const i=first.indexOf('\n');if(i<0)return;
          const obj=first.slice(0,i).replace(/^OBJECT:\s*/i,'').trim();d=first.slice(i+1);head=false;
          if(obj){research(obj,{silent:true,noOv:true}).catch(()=>{});R=curR;R.ov.body.textContent='';p=document.createElement('p');R.ov.body.append(p);note('Identified: '+obj)}
        }
        txt+=d;if(p)p.textContent=txt;sn.add(d);
      },onSources(){}});
    if(head&&first){sn.add(first.replace(/^OBJECT:\s*/i,''));txt=first}
  }catch(e){
    if(e.name==='AbortError')return;
    parts.push({t:'I could not analyse the picture. '+e.message});note('Vision problem: '+e.message);$('#dmsg').textContent=e.message;
  }
  sn.end();
  if(txt){hist.push({role:'user',content:'[I showed the camera something] '+user},{role:'assistant',content:txt});while(hist.length>12)hist.splice(0,2)}
}
